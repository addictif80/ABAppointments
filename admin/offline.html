<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hors ligne</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f6f9; color: #333; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .box { max-width: 380px; }
        h1 { font-size: 1.3rem; margin-bottom: 8px; }
        p { color: #777; }
        button { margin-top: 16px; padding: 10px 24px; border: none; border-radius: 8px; background: #e91e63; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Pas de connexion</h1>
        <p>Impossible de joindre le serveur. Vérifiez votre connexion internet et réessayez.</p>
        <button onclick="location.reload()">Réessayer</button>
    </div>
</body>
</html>
